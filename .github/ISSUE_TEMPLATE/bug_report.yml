name: "System & Hardware Bug Report"
description: "Report an OS, driver, input pipeline, or repository issue on FN-WORKSTATION or Mobile."
title: "[BUG]: "
labels: ["bug"]
assignees:
  - userfn-git
body:
  - type: dropdown
    id: device_node
    attributes:
      label: Target Device / Node
      options:
        - "FN-WORKSTATION (PC - Windows 11 Pro 25H2)"
        - "Mobile Device (Secondary Node)"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      options:
        - "OS & Windows Internals (Build 26200 / HVCI)"
        - "Hardware & Firmware (ASUS SM-H610 / BIOS 4003 / GTX 1660 Ti)"
        - "Peripherals & Input (Logitech G502 X / PRO X 60 / RawInput)"
        - "Physics & Telemetry (C++20 / Lua / Python / Shared Memory IPC)"
        - "Shell & Git Governance (PowerShell / MSYS2 UCRT64)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Incident Summary & Symptoms
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Hardware Baseline
      value: |
        - Hostname: FN-WORKSTATION
        - OS: Microsoft Windows 11 Pro (25H2, Build 26200)
        - CPU: Intel Core i5-12400F | GPU: NVIDIA GTX 1660 Ti | RAM: 32 GB
        - Motherboard: ASUS SM-H610 (BIOS 4003)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs (Redact Serials)
      render: powershell
