name: "System & Hardware Bug Report (PC / Workstation)"
description: "Report an OS, driver, input pipeline, telemetry, or repository bug on FN-WORKSTATION."
title: "[BUG]: "
labels: ["bug", "triage", "env:pc-workstation"]
assignees:
  - userfn-git
body:
  - type: dropdown
    id: target_device
    attributes:
      label: Target Device / Node
      options:
        - "FN-WORKSTATION (Primary PC - Windows 11 Pro 25H2)"
        - "Mobile Device (Secondary Node)"
        - "Multi-Device / Cloud Sync"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      options:
        - "OS & Kernel / Windows Internals (Build 26200 / HVCI)"
        - "Hardware & Firmware (ASUS SM-H610 / BIOS 4003 / GPU / NVMe)"
        - "Input & Peripherals (Logitech G502 X / PRO X 60 / DirectInput / RawInput)"
        - "Physics & Telemetry Engine (C++20 / Lua / Python / Shared Memory IPC)"
        - "Shell & Automation (PowerShell / MSYS2 UCRT64 / Git)"
        - "Game Environment (Rocket League 240Hz / EOS / Configs)"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Incident Description & Symptoms
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: hardware_baseline
    attributes:
      label: Verified Workstation Baseline (FN-WORKSTATION)
      value: |
        - Hostname: FN-WORKSTATION
        - OS: Microsoft Windows 11 Pro (25H2, Build 26200, 64-bit)
        - CPU: 12th Gen Intel Core i5-12400F (6C / 12T)
        - GPU: NVIDIA GeForce GTX 1660 Ti (240Hz Output)
        - RAM: 32 GB Physical DDR4
        - Motherboard / BIOS: ASUS SM-H610 (UEFI BIOS 4003)
        - Peripherals: Logitech G502 X + Logitech PRO X 60
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs
      render: powershell
